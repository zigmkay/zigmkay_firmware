name: Native practice contracts

on:
  push:
    branches: [main]
    paths: &paths
      - "companion/**"
      - "zigmkay/**"
      - "keyboards/**"
      - "zkeycodes/**"
      - build.zig
      - build.zig.zon
      - .github/workflows/companion-practice-contracts.yml
  pull_request:
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: companion

jobs:
  practice:
    strategy:
      fail-fast: false
      matrix:
        # Linux is already covered by companion-offline-checks.yml.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.0
          # On Windows runners, the tool cache lives on the slower C: drive.
          use-tool-cache: ${{ runner.os != 'Windows' }}
          cache-key: tc1
          cache-size-limit: 4096
      # Also the subprocess, flash-job and release tooling tests on macOS and Windows.
      - name: Verify compiler and run typing test, subprocess and release contracts
        shell: bash
        run: |
          test "$(zig version)" = 0.17.0
          zig build test-practice test-jobs -Donly=practice -j4 --test-timeout 45s
